services:
  db:
    container_name: modellink_postgres
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
    volumes:
      - db:/var/lib/postgresql/data
    security_opt:
      - apparmor=modellink-restrict-db
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    container_name: modellink_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5333:80"
    security_opt:
      - apparmor=modellink-restrict-pgadmin
    depends_on:
      - db
    networks:
      - db
    restart: unless-stopped

  # [DELETE] certbot-init is no longer needed. SSL is handled by the Global Host Nginx + Certbot.
  # certbot-init:
  #   image: certbot/certbot
  #   container_name: certbot-init
  #   volumes:
  #     - certs:/etc/letsencrypt
  #     - webroot:/var/www/certbot
  #   entrypoint: ""
  #   command: >
  #     sh -c ' if [ ! -d "/etc/letsencrypt/live/api.millensys.com" ]; then
  #       echo "Creating self-signed certificate for initial setup...";
  #       mkdir -p /etc/letsencrypt/live/api.millensys.com;
  #       openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
  #         -keyout /etc/letsencrypt/live/api.millensys.com/privkey.pem \
  #         -out /etc/letsencrypt/live/api.millensys.com/fullchain.pem \
  #         -subj "/CN=api.millensys.com";
  #       echo "Self-signed certificate created. Replace with real cert using certbot.";
  #     else
  #       echo "Certificate already exists.";
  #     fi '
  #   networks:
  #     - db

  nginx:
    image: nginx:alpine
    container_name: modellink_nginx
    ports:
      - "8080:80"
    security_opt:
      - apparmor=modellink-restrict-nginx
    depends_on:
      # [DELETE] certbot-init dependency removed — no longer needed.
      # certbot-init:
      #   condition: service_completed_successfully
      backend:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/main.conf:ro
      # Mount the same app-volume the backend uses so nginx can serve /public directly
      - app-volume:/var/www/html/public:ro
      # [DELETE] Webroot and certs volumes are no longer needed — SSL is on the Host Nginx.
      # - webroot:/var/www/certbot:ro
      # - certs:/etc/letsencrypt:ro
    networks:
      - db
      - modelink-network
    restart: unless-stopped

  backend:
    container_name: modellink_backend
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@modellink_postgres:5432/${POSTGRES_DB}"
      NODE_ENV: production
      PUBLIC_DIR: /public
      LOG_DIR: /logs
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    volumes:
      - app-volume:/public
      - logs-volume:/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db
      - modelink-network
    ports:
      - "8000:8000"
    restart: unless-stopped
  # [DELETE] certbot renewal service is no longer needed. Ubuntu systemd timer handles renewal automatically.
  # certbot:
  #   image: certbot/certbot
  #   container_name: certbot
  #   depends_on:
  #     - nginx
  #   volumes:
  #     - certs:/etc/letsencrypt
  #     - webroot:/var/www/certbot
  #   entrypoint: ""
  #   command: >
  #     sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --deploy-hook 'nginx -s reload' || true; done"
  #   restart: unless-stopped

networks:
  db:
    driver: bridge
  modelink-network:
    external: true

volumes:
  db:
  app-volume:
  logs-volume:
  # [DELETE] webroot and certs volumes removed — SSL is handled by the Global Host Nginx.
  # webroot:
  # certs:
