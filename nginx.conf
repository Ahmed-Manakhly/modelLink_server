server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # TODO: still we need to replace by domain name
    server_name www.modellink.com modellink.com;    

    # TODO : still we need to add ssl_certificate
    client_max_body_size 100M;

    # HTTPS Redirect
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Security WAF
    deny 77.90.13.20;
    deny 106.13.122.198;
    deny 139.162.88.198;

    location ~* ^/(test|en/test|cgi-bin|\.env|\.git|\.svn|wp-admin|wp-login|sdk|wsman|v1/statement) {
        return 444; 
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location /public/ {
        alias /var/www/html/public/;
        autoindex off;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/ =404;
    }

    add_header Strict-Transport-Security "max-age=0;" always;

    location /api {
        proxy_pass http://modellink_backend:8000; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 4. SITEMAP Proxy (Dynamic XML from Backend)
    location = /sitemap.xml {
        proxy_pass http://modellink_backend:8000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # 5. FRONTEND Proxy
    location / {
        proxy_pass http://modellink_frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}